<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa</title>
<link rel="stylesheet" href="painel.css">
</head>
<body>
<div class="cabeca">
  <header class="topo">
    <svg class="ico marca" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg>
    <div class="quem">
      <strong>Lupa</strong>
      <span id="quem">aguardando o jogo</span>
    </div>
    <span id="status" class="status"></span>
    <button type="button" id="central" class="botao botao-central" title="Abrir a Central da Lupa em uma aba">Central</button>
  </header>
  <div id="xp-topo" class="xp-topo" hidden></div>
  <div id="personagens" class="personagens" hidden></div>
  <nav id="abas" class="abas" aria-label="Seções do painel"></nav>
</div>
<main id="conteudo" class="conteudo"></main>
<footer class="rodape">
  <svg class="ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 11h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2z"></path><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
  <span>Só leitura: não clica e não aperta teclas. Os dados ficam no seu navegador; com o Lupa Online ligado em Ajustes, vão também para o seu banco.</span>
</footer>
<script src="planos.js"></script>
<script src="plano.js"></script>
<script src="ui.js"></script>
<script src="painel.js"></script>
</body>
</html>
