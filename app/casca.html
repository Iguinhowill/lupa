<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa</title>
<link rel="stylesheet" href="casca.css">
</head>
<body>
<header class="faixa">
  <div class="marca">
    <svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg>
    <span>Lupa</span>
  </div>
  <div class="abas" id="abas" role="tablist" aria-label="Contas, lado a lado e Central"></div>
  <div class="espaco"></div>
  <div class="direita">
    <button type="button" class="botao" id="painel" aria-pressed="false" title="Mostrar ou esconder o painel da Lupa (Ctrl+B)">
      <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
      <span>Painel</span>
    </button>
    <button type="button" class="botao so-ico" id="recarregar" title="Recarregar o jogo desta aba (F5)" aria-label="Recarregar o jogo desta aba">
      <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
    </button>
    <div class="atualizacao" id="atualizacao"></div>
    <button type="button" class="botao so-ico" id="ajustes" aria-haspopup="true" aria-expanded="false" title="Ajustes e atalhos" aria-label="Ajustes e atalhos">
      <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3h3.4l.5 2.4 1.7.7 2-1.4 2.4 2.4-1.4 2 .7 1.7 2.4.5v3.4l-2.4.5-.7 1.7 1.4 2-2.4 2.4-2-1.4-1.7.7-.5 2.4h-3.4l-.5-2.4-1.7-.7-2 1.4-2.4-2.4 1.4-2-.7-1.7L3 13.7v-3.4l2.4-.5.7-1.7-1.4-2 2.4-2.4 2 1.4 1.7-.7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
  </div>
</header>
<div class="etiquetas" id="etiquetas" hidden></div>
<div class="cortina" id="cortina" hidden></div>
<div class="menu" id="menu" role="menu" aria-label="Ajustes" hidden></div>
<script src="casca.js"></script>
</body>
</html>
